# Gateway API route (served by Envoy Gateway). Kept under the old ingress.yaml
# name because every local.yaml's system-pod commands apply this exact path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mailpit
  namespace: default
spec:
  parentRefs:
  - name: auto-gateway
    namespace: envoy-gateway-system
  hostnames:
  - mailpit.local
  rules:
  - backendRefs:
    - name: mailpit
      port: 80
