apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: default
spec:
  selector:
    app: mailpit
  ports:
  # SMTP. Pods send mail here (EMAIL_HOST=mailpit, EMAIL_PORT=1025).
  - name: smtp
    protocol: TCP
    port: 1025
    targetPort: 1025
  # Web UI. Exposed on 80 so the ingress can reach it at mailpit.local.
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8025
  # The web UI on its own port too, which the route uses. A pod that ships its
  # own Service named mailpit replaces this one, usually with only 1025 and
  # 8025; the route still finds 8025 whichever Service is there.
  - name: web
    protocol: TCP
    port: 8025
    targetPort: 8025
  type: ClusterIP
