# auto's documentation site, built with Zensical (https://zensical.org) and
# published to GitHub Pages by .github/workflows/docs.yml.
#
#   pip install -r docs-requirements.txt
#   zensical serve        # http://localhost:8000, rebuilds as you edit
#   zensical build --strict --clean   # what CI runs
#
# The README is the front page on GitHub; the how-to material lives here.

[project]
site_name = "auto"
site_description = "One command from git clone to your whole platform running on a local Kubernetes cluster."
site_author = "DevOcho"
site_url = "https://devocho.github.io/auto/"
copyright = "Made with love by <a href=\"https://www.devocho.com\">DevOcho</a> &middot; MIT License"
repo_url = "https://github.com/DevOcho/auto"
repo_name = "DevOcho/auto"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install" = "getting-started/install.md" },
    { "Your first cluster" = "getting-started/first-cluster.md" },
    { "How auto works" = "getting-started/how-it-works.md" },
  ] },
  { "Guides" = [
    { "Add your app" = "guides/add-your-app.md" },
    { "Expose it with a route" = "guides/routes.md" },
    { "Databases and system pods" = "guides/system-pods.md" },
    { "Catch email with Mailpit" = "guides/mailpit.md" },
    { "HTTPS" = "guides/https.md" },
    { "Share a setup with your team" = "guides/teams.md" },
    { "Moving from ingress-nginx" = "guides/from-ingress-nginx.md" },
  ] },
  { "Reference" = [
    { "Commands" = "reference/commands.md" },
    { "local.yaml" = "reference/local-yaml.md" },
    { ".auto/config.yaml" = "reference/pod-config.md" },
    { "Gateway settings" = "reference/gateway.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Release notes" = [
    { "0.9.2" = "releases/0.9.2.md" },
    { "0.9.1" = "releases/0.9.1.md" },
    { "0.9.0" = "releases/0.9.0.md" },
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
favicon = "assets/favicon.ico"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/square-terminal"
repo = "fontawesome/brands/github"

# Follows the reader's system setting, with a toggle. The primary color is
# DevOcho red, set in docs/assets/extra.css.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/DevOcho/auto"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
# Lets a page show a file from the repo (the route templates) without a copy
# that can drift: --8<-- "docs/templates/routes.yaml"
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
