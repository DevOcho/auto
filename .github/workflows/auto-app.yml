name: Python application

on:
  push:
    tags:
      - 'v*.*.*'
  # A pull request that changes the build is built and started here too, so a
  # binary that won't run is caught before a tag publishes it. Only a tag
  # packages and publishes.
  pull_request:
    paths:
      - '.github/workflows/auto-app.yml'
      - 'build_requirements.txt'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux binary needs a glibc at least as new as the machine it was
          # built on, so it is built on the oldest Ubuntu we support. 22.04's
          # glibc 2.35 runs on Ubuntu 22.04 and newer, Debian 12, Fedora and
          # Arch. Never ubuntu-latest: 0.9.0 was built on 26.04 when GitHub
          # moved it there and needed glibc 2.42, which Ubuntu 24.04 lacks.
          - os: ubuntu-22.04
            asset_suffix: linux-x86_64
          - os: macos-latest
            asset_suffix: darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Create and activate virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip

    - name: Install dependencies
      run: |
        source venv/bin/activate
        pip install flake8 pytest pyinstaller
        if [ -f build_requirements.txt ]; then pip install -r build_requirements.txt; fi

    - name: Lint with flake8
      run: |
        source venv/bin/activate
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=./venv/*
        flake8 . --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics --exclude=./venv/*

    - name: Build with pyinstaller
      run: |
        source venv/bin/activate
        pyinstaller --collect-all pyfiglet \
                    --collect-submodules rich \
                    --collect-all autocli \
                    --hidden-import "rich._unicode_data.unicode17-0-0" \
                    --hidden-import "charset_normalizer" \
                    --hidden-import "chardet" \
                    --onefile ./auto/auto.py

    - name: List dist directory
      run: ls -l dist/

    # Start the binary here and, on Linux, on the oldest systems auto supports.
    # With no config, auto offers to create its code folder: `y` answers that.
    - name: Start the binary
      run: |
        mkdir -p "$RUNNER_TEMP/home"
        echo y | HOME="$RUNNER_TEMP/home" AUTO_NO_UPDATE_CHECK=1 dist/auto --version
        if [ "$RUNNER_OS" = Linux ]; then
          for image in ubuntu:22.04 debian:bookworm; do
            echo "== $image"
            echo y | docker run --rm -i -e AUTO_NO_UPDATE_CHECK=1 \
              -v "$PWD/dist:/dist:ro" "$image" /dist/auto --version
          done
        fi

    - name: Create distribution directory
      if: github.ref_type == 'tag'
      run: |
        # Stage release files under an arch-tagged directory so the tarball is unambiguous
        STAGE=release/auto-${{ github.ref_name }}-${{ matrix.asset_suffix }}
        mkdir -p "$STAGE"
        cp dist/auto "$STAGE/"
        cp -r auto/config "$STAGE/"
        cp -r auto/k3s "$STAGE/"
        cp README.md "$STAGE/"

    - name: Create tar.gz archive
      if: github.ref_type == 'tag'
      run: |
        tar -czvf auto-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz \
            -C release auto-${{ github.ref_name }}-${{ matrix.asset_suffix }}

    - name: Upload artifact
      if: github.ref_type == 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: auto-${{ github.ref_name }}-${{ matrix.asset_suffix }}
        path: auto-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz
        if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # docs/releases/X.Y.Z.md becomes the release's description; a release
    # without one gets GitHub's generated list of merged pull requests.
    - name: Find the release notes
      id: notes
      run: |
        notes="docs/releases/${GITHUB_REF_NAME#v}.md"
        if [ -f "$notes" ]; then
          echo "path=$notes" >> "$GITHUB_OUTPUT"
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: List downloaded artifacts
      run: ls -l artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        body_path: ${{ steps.notes.outputs.path }}
        generate_release_notes: ${{ steps.notes.outputs.path == '' }}
        files: |
          artifacts/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
