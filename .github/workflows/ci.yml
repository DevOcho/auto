name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-linux:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:bookworm
          - fedora:latest
          - archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ matrix.distro }} \
            -f docker/test.Dockerfile \
            -t auto-test:${{ strategy.job-index }} \
            .

      - name: Show Python version
        run: |
          docker run --rm auto-test:${{ strategy.job-index }} \
            uv run --frozen python --version

      - name: Run pytest
        run: docker run --rm auto-test:${{ strategy.job-index }}

  # The same tests on ARM, where the linux-arm64 release is built
  test-linux-arm:
    name: Test (${{ matrix.distro }}, arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:24.04
          - debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ matrix.distro }} \
            -f docker/test.Dockerfile \
            -t auto-test:${{ strategy.job-index }} \
            .

      - name: Run pytest
        run: docker run --rm auto-test:${{ strategy.job-index }}

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      # The locked dependencies, on Python 3.12 from .python-version
      - name: Install dependencies
        run: uv sync --frozen && uv run --frozen python --version

      # config.py builds CONFIG at import time: with no local.yaml it writes a
      # default and then asks whether to create the code directory, which has
      # no answer on a runner and fails collection for every test module.
      - name: Seed a minimal auto config
        run: |
          mkdir -p ~/.auto/config /tmp/auto-code
          printf 'code: /tmp/auto-code\nhttps: false\npods: []\nsystem-pods: []\n' \
            > ~/.auto/config/local.yaml

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/auto
        run: uv run --frozen pytest --tb=short -v
