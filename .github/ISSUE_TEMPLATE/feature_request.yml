name: Feature request
description: Something auto should do, or do differently
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem, in terms of your project. What does auto make hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, if you have an idea. A config snippet or command is great.
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: Any workaround you're using.
