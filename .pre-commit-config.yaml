-   repo: local
    hooks:
      - id: pytest
        name: pytest
        stages: [pre-commit]
        language: system
        entry: uv run --frozen pytest auto/autocli --cov=auto/autocli --cov-fail-under=20
        pass_filenames: false
        always_run: true
